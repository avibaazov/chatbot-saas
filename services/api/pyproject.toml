[project]
name = "api"
version = "0.1.0"
description = "Chatbot SaaS backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "motor>=3.5",            # async MongoDB driver
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",           # ASGI test client
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
