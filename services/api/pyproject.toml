[project]
name = "api"
version = "0.1.0"
description = "Chatbot SaaS backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "motor>=3.5",            # async MongoDB driver
    "pyjwt[crypto]>=2.8",    # verify Clerk session tokens (RS256 via JWKS)
    "anthropic>=1,<2",       # RAG answer generation (Claude Messages API)
    "voyageai>=0.3",         # embeddings for ingestion + retrieval
    "httpx>=0.27",           # outbound fetching for URL ingestion (also the ASGI test client)
    "trafilatura>=1.8",      # main-content extraction from fetched HTML
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
